<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset=".55" stop-color="#5b6cff"/>
      <stop offset="1" stop-color="#af52de"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f5f7"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8e8ed"/>
      <stop offset="1" stop-color="#c7c7cc"/>
    </linearGradient>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#000" flood-opacity=".22"/>
    </filter>
    <filter id="innerHi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Rounded square background, iOS-style squircle approximation -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>

  <!-- Subtle inner highlight at top -->
  <rect x="0" y="0" width="1024" height="420" rx="228" ry="228" fill="#ffffff" opacity=".10"/>

  <!-- Paper note -->
  <g filter="url(#paperShadow)">
    <!-- Folded corner shape: paper rect with cut top-right and fold triangle -->
    <path d="M 260 200
             L 700 200
             L 824 324
             L 824 824
             Q 824 868 780 868
             L 260 868
             Q 216 868 216 824
             L 216 244
             Q 216 200 260 200 Z"
          fill="url(#paper)"/>
    <!-- Fold triangle -->
    <path d="M 700 200 L 700 324 L 824 324 Z"
          fill="url(#fold)"/>
    <path d="M 700 200 L 700 324 L 824 324"
          fill="none" stroke="#a0a0a8" stroke-width="2" opacity=".4"/>
  </g>

  <!-- Text lines on paper -->
  <g>
    <!-- Title bar — colored accent -->
    <rect x="280" y="380" width="320" height="22" rx="11" fill="#0a84ff"/>
    <!-- Body lines (grayscale) -->
    <rect x="280" y="442" width="480" height="14" rx="7" fill="#c7c7cc"/>
    <rect x="280" y="486" width="440" height="14" rx="7" fill="#c7c7cc"/>
    <rect x="280" y="530" width="500" height="14" rx="7" fill="#c7c7cc"/>
    <rect x="280" y="574" width="360" height="14" rx="7" fill="#c7c7cc"/>
    <!-- Code-like indent line, different color -->
    <rect x="320" y="618" width="380" height="14" rx="7" fill="#34c759" opacity=".9"/>
    <rect x="280" y="662" width="420" height="14" rx="7" fill="#c7c7cc"/>
    <rect x="280" y="706" width="260" height="14" rx="7" fill="#c7c7cc"/>
  </g>

  <!-- Caret / cursor -->
  <rect x="555" y="700" width="3" height="24" fill="#0a84ff" opacity=".85"/>

  <!-- Optional small bookmark ribbon -->
  <path d="M 668 200 L 668 305 L 700 285 L 732 305 L 732 200 Z"
        fill="#ff3b30" opacity=".0"/>
</svg>
