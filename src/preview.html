<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no">
<link rel="stylesheet" href="style.css">
<script src="bookos-palette.js"></script>
<title>Vista previa</title>
<script src="locales.js"></script>
<script src="i18n.js"></script>
</head>
<body>
<div class="main-container windowed vp">
  <div class="vp-barra" data-tauri-drag-region>
    <div class="preview-mode-pills" id="preview-mode-pills">
              <button class="pill" data-pmode="auto" title="Automático según extensión">Auto</button>
              <button class="pill" data-pmode="html" title="Render HTML del editor">HTML</button>
              <button class="pill" data-pmode="md" title="Render Markdown del editor">MD</button>
              <button class="pill" data-pmode="url" title="Cargar URL externa">URL</button>
            </div>
    <div class="vp-titulo" id="vp-titulo"></div>
    <div class="vp-hueco" data-tauri-drag-region></div>
    <button class="tool-btn" id="preview-refresh" title="Recargar" aria-label="Recargar">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
            </button>
    <button class="tool-btn shield-badge on" id="shield-badge" title="Adblock activo" aria-label="Adblock">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/></svg>
            </button>
    <div class="controls">
      <button id="close" data-i18n-title="wm.close" title="Cerrar"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 4.6L11.4 11.4M11.4 4.6L4.6 11.4"/></svg></button>
    </div>
  </div>
  <div class="vp-url" id="vp-url" hidden>
    <input type="text" class="url-input" id="url-input" placeholder="https://… · youtube.com/watch?v=… · localhost:3000" spellcheck="false">
    <button class="tool-btn" id="url-go" title="Cargar (Enter)" aria-label="Cargar">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg>
            </button>
  </div>
  <div class="preview-body" id="preview-body"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="vendor/marked.min.js"></script>
<script src="tauri-bridge.js"></script>
<script src="preview.js" type="module"></script>
</body>
</html>
