[package]
name = "bookos-notepad"
version = "0.7.0"
edition = "2024"
license = "LicenseRef-BookOS"

[dependencies]
bookos-ui = { path = "../../plantilla-gpui/bookos-ui" }
gpui = { path = "../../fonts/vendor/gpui/crates/gpui", default-features = false, features = ["font-kit", "wayland"] }
gpui_platform = { path = "../../fonts/vendor/gpui/crates/gpui_platform", features = ["wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
base64 = "0.22"
futures = "0.3"
libc = "0.2"
